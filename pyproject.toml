[tool.poetry]
name = "iarsenic-training-data"
version = "0.1.0"
description = "Builds the iArsenic training data from the source well data"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.2"
numpy = ">=1.26"
geopandas = ">=1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# for experiments/model6-evaluation: poetry install --with experiments
[tool.poetry.group.experiments]
optional = true

[tool.poetry.group.experiments.dependencies]
scikit-learn = ">=1.4"
lightgbm = ">=4.0"
rasterio = ">=1.3"
matplotlib = ">=3.8"
tqdm = ">=4.66"
filelock = ">=3.13"
jupyter = ">=1.0"
nbformat = ">=5.9"
nbconvert = ">=7.0"
